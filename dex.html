<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안전해수욕장 · 나의 바다 도감</title><style>
:root{--bg:#f2f8fb;--card:#fff;--fg:#0d2430;--muted:#5d7684;--line:#dbe7ee;--blue:#087e8b;--deep:#064d63;--orange:#ff765e;--aqua:#dff5f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Noto Sans KR',sans-serif;padding-bottom:86px}.top{background:linear-gradient(135deg,#075873,#0aa4a3);color:#fff;padding:20px}.wrap{max-width:520px;margin:auto}.toprow{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.brand b{color:var(--orange)}.back{border:1px solid #ffffff60;border-radius:12px;background:#ffffff14;color:#fff;padding:9px 11px;text-decoration:none;font-size:13px}main{max-width:520px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:16px;box-shadow:0 10px 26px #0b3e4812}.card h2{font-size:17px;margin:0 0 4px}.muted{font-size:12px;color:var(--muted);line-height:1.55}.upload{display:block;margin-top:13px;border:1.5px dashed #75bfc4;border-radius:15px;padding:20px;text-align:center;color:var(--blue);font-weight:700;cursor:pointer}.upload input{display:none}.key{display:flex;gap:8px;margin-top:12px}.key input{min-width:0;flex:1;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font:inherit}.key button,.analyze{border:0;border-radius:11px;padding:11px 13px;background:var(--deep);color:#fff;font:inherit;font-weight:700;cursor:pointer}.preview{width:100%;max-height:235px;object-fit:cover;border-radius:15px;margin-top:13px}.result{display:grid;gap:10px}.pill{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700;background:#dff3e7;color:#167147}.pill.medium{background:#fff1cf;color:#956000}.pill.high{background:#ffe3df;color:#ad3527}.row{padding:11px;border-radius:13px;background:var(--aqua);font-size:13px;line-height:1.55}.row b{display:block;font-size:11px;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.entry{border:1px solid var(--line);border-radius:15px;overflow:hidden}.entry img{width:100%;height:85px;object-fit:cover}.entry div{padding:9px;font-size:12px}.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px}.loading{padding:12px;text-align:center;color:var(--blue);font-weight:700}.note{font-size:10px;color:var(--muted);margin-top:7px}body.dark{--bg:#081720;--card:#102934;--fg:#e9f4f7;--muted:#9bb3bd;--line:#244451;--aqua:#173e46}body.dark .key input{color:var(--fg)}
</style></head><body><header class="top"><div class="wrap toprow"><div><div class="brand"><b>안전해</b>수욕장</div><small>나의 바다 도감</small></div><a class="back" href="./">← 안전 정보</a></div></header><main><section class="card"><h2>🔎 해양생물 관찰 분석</h2><p class="muted">사진을 올리면 AI가 종, 행동, 위험도와 관광객 대처법을 분석합니다.</p><label class="upload">＋ 사진 촬영 또는 업로드<input id="photo" type="file" accept="image/*" capture="environment"></label><div class="key"><input id="api" type="password" placeholder="Gemini API 키 (브라우저에만 저장)"><button id="save">저장</button></div><p class="note">분석에는 본인의 Gemini API 키가 필요합니다. 키는 이 기기에만 저장됩니다.</p><div id="work"></div></section><section class="card"><h2>🐚 나의 바다 도감 <span id="count" class="muted"></span></h2><div id="dex"></div></section></main><script>
const KEY='safe-beach-gemini-key',DEX='safe-beach-dex-v1';let key=localStorage.getItem(KEY)||'',entries=JSON.parse(localStorage.getItem(DEX)||'[]');api.value=key;save.onclick=()=>{key=api.value.trim();localStorage.setItem(KEY,key);alert('이 기기에 저장했습니다.')} ;
function draw(){count.textContent=`${entries.length}종 발견`;dex.innerHTML=entries.length?`<div class="grid">${entries.map(e=>`<article class="entry">${e.photo?`<img src="${e.photo}">`:''}<div><b>${e.emoji||'🐚'} ${e.speciesName}</b><br><span class="muted">${e.count||1}회 관찰</span></div></article>`).join('')}</div>`:'<div class="empty">첫 해양생물 사진을 올려 도감을 시작하세요.</div>'}draw();
photo.onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!key){work.innerHTML='<p class="muted">먼저 Gemini API 키를 입력해 주세요.</p>';return}const data=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});work.innerHTML=`<img class="preview" src="${data}"><div class="loading">AI가 사진을 분석하고 있습니다…</div>`;try{const m=/^data:(.*?);base64,(.*)$/.exec(data);const prompt='You are a marine biologist and beach safety expert. Analyze this photo. Reply ONLY JSON in Korean: {"isMarineLife":true,"speciesName":"","scientificName":"","emoji":"","behavior":"","meaning":"","riskLevel":"low|medium|high","riskReason":"","advice":"","confidence":0}';const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inlineData:{mimeType:m[1],data:m[2]}}]}],generationConfig:{responseMimeType:'application/json'}})});if(!res.ok)throw Error('API 요청에 실패했습니다. 키를 확인해 주세요.');const out=JSON.parse((await res.json()).candidates[0].content.parts[0].text);if(!out.isMarineLife)throw Error('해양생물을 확인하지 못했습니다. 다른 사진을 사용해 주세요.');const existing=entries.find(x=>x.speciesName===out.speciesName);if(existing){existing.count=(existing.count||1)+1;existing.photo=data}else{entries.unshift({...out,photo:data,count:1})}localStorage.setItem(DEX,JSON.stringify(entries));draw();work.innerHTML=`<img class="preview" src="${data}"><div class="result"><h2>${out.emoji||'🐚'} ${out.speciesName}</h2><span class="pill ${out.riskLevel==='high'?'high':out.riskLevel==='medium'?'medium':''}">위험도 ${out.riskLevel==='high'?'높음':out.riskLevel==='medium'?'보통':'낮음'}</span><div class="row"><b>관찰된 행동</b>${out.behavior}</div><div class="row"><b>행동의 의미</b>${out.meaning}</div><div class="row"><b>관광객 대처법</b>${out.advice}</div></div>`}catch(err){work.innerHTML=`<p class="muted">${err.message}</p>`}};
</script><script src="dexProxy.js?v=2"></script><script src="dexSettings.js?v=1"></script></body></html>
